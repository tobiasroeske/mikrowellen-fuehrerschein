<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img">
<title>Freundliche Comic-Mikrowelle mit Fahrschul-L-Schild (quadratisch)</title>
<style>
[class]{transform-box:fill-box;transform-origin:center}
text{font-family:system-ui,sans-serif}
.blink{animation:blink 4.5s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.wob{transform-origin:50% 100%;animation:wob 2.4s ease-in-out infinite alternate}
@keyframes wob{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="300" height="300" rx="16" fill="#dfe8f5"/>
