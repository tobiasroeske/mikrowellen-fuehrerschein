<rect x="260" y="54" width="6" height="18" fill="#9aa1a9"/><rect x="282" y="54" width="6" height="18" fill="#9aa1a9"/>
<rect x="60" y="70" width="280" height="170" rx="18" fill="#e6e8eb"/>
