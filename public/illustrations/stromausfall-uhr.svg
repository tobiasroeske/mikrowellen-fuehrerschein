<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img">
<title>Nach dem Stromausfall blinkt die Mikrowelle 12:00</title>
<style>
[class]{transform-box:fill-box;transform-origin:center}
text{font-family:system-ui,sans-serif}
.bl{animation:bl 1s steps(1) infinite}
@keyframes bl{0%{opacity:1}50%{opacity:0}}
.q{animation:fl 1.6s ease-in-out infinite alternate}
@keyframes fl{from{transform:translateY(0) rotate(-8deg)}to{transform:translateY(-8px) rotate(8deg)}}
.bo{animation:bl 2s steps(1) infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="400" height="300" rx="16" fill="#eef1f5" stroke="#d3d8de" stroke-width="2"/>
<g stroke="#1d2330" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
<ellipse cx="180" cy="262" rx="150" ry="8" fill="#000" opacity=".08" stroke="none"/>
<rect x="30" y="82" width="300" height="172" rx="18" fill="#e6e8eb"/>
<rect x="44" y="96" width="170" height="144" rx="10" fill="#34445f"/>
<circle cx="102" cy="150" r="13" fill="#fff"/><circle cx="162" cy="150" r="13" fill="#fff"/>
<path d="M99 150a4 4 0 1 1 4 3M159 150a4 4 0 1 1 4 3" fill="none" stroke-width="2.5"/>
<path d="M104 196q14-12 28 0t28 0" fill="none" stroke="#fff" stroke-width="5"/>
<path d="M190 104q-6 12 0 16q6-4 0-16z" fill="#6ec1f0" stroke-width="2"/>
<rect x="224" y="96" width="92" height="144" rx="8" fill="#fff"/>
<rect x="230" y="106" width="80" height="36" rx="4" fill="#1d2b22"/>
<text class="bl" x="270" y="132" text-anchor="middle" font-family="ui-monospace,monospace" font-size="24" font-weight="700" fill="#7CFC9A" stroke="none">12:00</text>
<circle cx="246" cy="170" r="6" fill="#1f4e9c"/><circle cx="270" cy="170" r="6" fill="#d7262e"/><circle cx="294" cy="170" r="6" fill="#f5c400"/>
<circle cx="270" cy="211" r="15" fill="#1f4e9c"/><path d="M270 211V199" stroke="#fff" stroke-width="3"/>
<polygon class="bo" points="76,14 48,58 66,58 54,84 90,38 72,38 86,14" fill="#f5c400"/>
<g class="q"><circle cx="360" cy="86" r="26" fill="#f5c400"/><text x="360" y="98" text-anchor="middle" font-size="36" font-weight="700" fill="#1d2330" stroke="none">?</text></g>
<g class="q" style="animation-delay:-.8s"><circle cx="150" cy="44" r="18" fill="#fff"/><text x="150" y="55" text-anchor="middle" font-size="26" font-weight="700" fill="#1f4e9c" stroke="none">?</text></g>
</g>
</svg>
